[project]
name = "justicegram"
version = "1.0.0"
description = "JusticeGram - AI-Powered Legal Assistance Platform"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0"
]

[tool.vercel]
entrypoint = "run:app"
