{% extends "base.html" %}

{% block title %}Server Error (500) — {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="max-w-600 mx-auto py-5">
    <div class="display-1 fw-bold text-danger mb-3">500</div>
    <h3 class="fw-bold mb-2">Unexpected Server Error</h3>
    <p class="text-muted mb-4">Our servers encountered an unexpected issue while processing your legal request. Our team has been notified.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-jg-primary">Return to Homepage</a>
  </div>
</div>
{% endblock %}
