{% extends "base.html" %}

{% block title %}Page Not Found (404) — {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="max-w-600 mx-auto py-5">
    <div class="display-1 fw-bold text-teal mb-3">404</div>
    <h3 class="fw-bold mb-2">Page Not Found</h3>
    <p class="text-muted mb-4">The legal resource, practitioner profile, or page you were looking for does not exist or has been moved.</p>
    <div class="d-flex justify-content-center gap-2">
      <a href="{{ url_for('main.index') }}" class="btn btn-jg-primary">Back to Homepage</a>
      <a href="{{ url_for('assistant.assistant') }}" class="btn btn-jg-outline">Ask AI Assistant</a>
    </div>
  </div>
</div>
{% endblock %}
