{% extends "base.html" %}

{% block title %}Create Account — {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="jg-card p-4 p-sm-5 shadow-sm">
        <div class="text-center mb-4">
          <div class="jg-brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
            <i class="bi bi-bank2"></i>
          </div>
          <h3 class="fw-bold mb-1">Create Your Account</h3>
          <p class="text-muted small">Join JusticeGram to save query histories, bookmark pro bono clinics, and connect with legal resources.</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
          <div class="row g-3 mb-3">
            <div class="col-12">
              <label for="name" class="form-label small fw-semibold">Full Name *</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                <input type="text" id="name" name="name" class="form-control border-start-0" placeholder="e.g. Priya Sharma" value="{{ name or '' }}" required autofocus>
              </div>
            </div>

            <div class="col-12">
              <label for="email" class="form-label small fw-semibold">Email Address *</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" id="email" name="email" class="form-control border-start-0" placeholder="name@example.com" value="{{ email or '' }}" required>
              </div>
            </div>

            <div class="col-sm-6">
              <label for="phone" class="form-label small fw-semibold">Phone Number</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone text-muted"></i></span>
                <input type="tel" id="phone" name="phone" class="form-control border-start-0" placeholder="Mobile Number" value="{{ phone or '' }}">
              </div>
            </div>

            <div class="col-sm-6">
              <label for="city" class="form-label small fw-semibold">City</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-geo-alt text-muted"></i></span>
                <input type="text" id="city" name="city" class="form-control border-start-0" placeholder="e.g. Bengaluru" value="{{ city or '' }}">
              </div>
            </div>

            <div class="col-sm-6">
              <label for="password" class="form-label small fw-semibold">Password *</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" id="password" name="password" class="form-control border-start-0" placeholder="Min. 6 characters" minlength="6" required>
              </div>
            </div>

            <div class="col-sm-6">
              <label for="confirm_password" class="form-label small fw-semibold">Confirm Password *</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control border-start-0" placeholder="Repeat password" required>
              </div>
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
            <label class="form-check-label small text-muted" for="termsCheck">
              I understand that JusticeGram is an informational platform and does not replace formal legal counsel.
            </label>
          </div>

          <button type="submit" class="btn btn-jg-primary w-100 py-2 mb-3">
            Register Account
          </button>

          <div class="text-center small text-muted">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" class="text-teal fw-semibold text-decoration-none">Sign In</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
